[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1manager-save-tools"
version = "0.1.0"
description = "Safe, scriptable edits to an F1 Manager save database"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fidelis Mwansa" }]
keywords = ["f1-manager", "sqlite", "save-editor", "modding", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Games/Entertainment :: Simulation",
    "Typing :: Typed",
]
# Nothing required at runtime: sqlite3 and argparse are stdlib. Keeping it that
# way means the tool installs anywhere Python does.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
f1manager = "f1manager.cli:main"

[project.urls]
Homepage = "https://github.com/kuroazai/f1-manager-25"
Issues = "https://github.com/kuroazai/f1-manager-25/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/f1manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SIM117 wants `with pytest.raises(X), SaveSession(...)` instead of nesting. That
# merge changes what is being asserted: the combined form also catches an
# exception raised by SaveSession.__enter__, and several of these tests exist
# precisely to distinguish "opening failed" from "the statement inside failed".
# Keeping them nested keeps the assertion honest.
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src/f1manager"]
ignore_missing_imports = true
warn_unused_ignores = true
